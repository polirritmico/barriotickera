[project]
name = "barriotickera"
version = "0.1.0"
description = "Sistema de gestión de entradas para eventos comunitarios"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Eduardo Bray", email = "ejbray@uc.cl" }, { name = "Rodrigo Callealta", email = "ro.callealta@duocuc.cl" }, { name = "Felipe Fernández", email = "fefernandez@duocuc.cl" }]
dependencies = [
  "oracledb>=26.0.1",
]

[project.scripts]
barriotickera = "barriotickera:main"

[dependency-groups]
dev = [
  "black>=26.5.1",
  "debugpy>=1.8.22",
  "isort>=9.0.1",
  "jedi>=0.17.2",
  "mypy>=2.3.1",
  "pyflakes>=4.0.0",
  "pylsp-mypy>=0.8.0",
  "pylsp-rope>=0.1.17",
  "python-language-server>=0.36.2",
  "python-lsp-ruff>=2.3.4",
  "python-lsp-server>=1.15.0",
  "ruff>=0.16.9",
]

[tool.uv]
package = false
