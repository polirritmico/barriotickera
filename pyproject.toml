[project]
name = "barriotickera"
version = "0.1.0"
description = "Sistema de gestión de entradas para eventos comunitarios"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Eduardo Bray", email = "ejbray@uc.cl" }, { name = "Rodrigo Callealta", email = "ro.callealta@duocuc.cl" }, { name = "Felipe Fernández", email = "fefernandez@duocuc.cl" }]
dependencies = [
  "oracledb>=26.0.1",
]

[project.scripts]
barriotickera = "barriotickera:main"

[dependency-groups]
dev = [
  "black>=26.5.1",
  "isort>=9.0.1",
  "pylsp-rope>=0.1.17",
  "python-language-server>=0.36.2",
  "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
